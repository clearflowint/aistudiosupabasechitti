name: ClearFlow validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript validation
        run: npm run lint
      - name: CFCF financial calculation tests
        run: npm run test:financial
      - name: n8n global registry contract tests
        run: npm run test:n8n-registry
      - name: Production build
        run: npm run build
